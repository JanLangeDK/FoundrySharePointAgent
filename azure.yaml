# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
    azd: '>=1.27.1'
    extensions:
        azure.ai.agents: '>=1.0.0-beta.9'
name: foundry-sharepoint-agent
services:
    sharepoint-rag-agent:
        project: src/agent-framework-agent-azure-search-rag-responses
        host: azure.ai.agent
        language: python
        uses:
            - ai-project
        env:
            AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
            AZURE_SEARCH_ENDPOINT: ${AZURE_SEARCH_ENDPOINT}
            AZURE_SEARCH_INDEX_NAME: ${AZURE_SEARCH_INDEX_NAME=sharepoint-documents}
            FOUNDRY_USER_PRINCIPAL_MAP_JSON: ${FOUNDRY_USER_PRINCIPAL_MAP_JSON={}}
            ALLOW_LOCAL_DEVELOPMENT_IDENTITY: ${ALLOW_LOCAL_DEVELOPMENT_IDENTITY=false}
            LOCAL_DEVELOPMENT_PRINCIPAL_IDS: ${LOCAL_DEVELOPMENT_PRINCIPAL_IDS=}
            SHAREPOINT_FOLDER_URL: ${SHAREPOINT_FOLDER_URL}
        codeConfiguration:
            dependencyResolution: remote_build
            entryPoint: main.py
            runtime: python_3_13
        container:
            resources:
                cpu: "0.5"
                memory: 1Gi
        description: A permission-aware Microsoft Agent Framework RAG agent for SharePoint documents indexed in Azure AI Search.
        kind: hosted
        metadata:
            tags:
                - Agent Framework
                - AI Agent Hosting
                - Azure AI AgentServer
                - Responses Protocol
                - RAG
                - Azure AI Search
        name: sharepoint-rag-agent
        protocols:
            - protocol: responses
              version: 2.0.0
    ai-project:
        host: azure.ai.project
        deployments:
            - model:
                  format: OpenAI
                  name: gpt-4.1-mini
                  version: "2025-04-14"
              name: gpt-4.1-mini
              sku:
                capacity: 10
                name: GlobalStandard
infra:
    provider: microsoft.foundry
hooks:
    postprovision:
        windows:
            shell: pwsh
            run: src/agent-framework-agent-azure-search-rag-responses/hooks/postprovision.ps1
            interactive: true
        posix:
            shell: sh
            run: src/agent-framework-agent-azure-search-rag-responses/hooks/postprovision.sh
            interactive: true
